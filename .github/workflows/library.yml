name: Library checks
on:
  push:
    paths: ['library/**', 'mechanism/index.html']
  pull_request:
    paths: ['library/**', 'mechanism/index.html']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        working-directory: library
      - run: node tools/validate.js
        working-directory: library
