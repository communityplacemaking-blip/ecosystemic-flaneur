<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>תצוגה: הכאורד עם צירים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap">
<style>
:root{--bg:#F7F2E8;--ink:#0F2D4A;--muted:#51657A;--teal:#1E8C86;--mustard:#D4A72C}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Heebo",system-ui,sans-serif;line-height:1.6}
.pv{background:var(--ink);color:var(--bg);font-size:.9rem;padding:8px 16px}
.pv a{color:var(--mustard)}
main{max-width:1240px;margin:0 auto;padding:28px 16px 48px}
h1{font-size:1.4rem;margin:0 0 18px}
/* the chart is laid out left-to-right so time runs past → future like the illustration */
.chart{direction:ltr;display:grid;grid-template-columns:auto 1fr;grid-template-rows:1fr auto;gap:0}
.y{grid-row:1;grid-column:1;position:relative;width:62px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6px 0;direction:rtl}
.y .line{position:absolute;right:6px;top:0;bottom:0;border-right:1.6px solid var(--ink)}
.y .line::before{content:"";position:absolute;top:-2px;right:-6.5px;border:6px solid transparent;border-bottom:10px solid var(--ink);border-top:0}
.y b{font-size:.95rem;writing-mode:vertical-rl;transform:rotate(180deg);margin-right:18px}
.y span{font-size:.8rem;color:var(--muted);margin-right:18px}
.img{grid-row:1;grid-column:2;margin:0}
.img img{display:block;width:100%;height:auto}
.x{grid-row:2;grid-column:2;position:relative;height:56px;border-top:1.6px solid var(--ink);direction:rtl}
.x::after{content:"";position:absolute;right:-2px;top:-7px;border:6px solid transparent;border-left:10px solid var(--ink);border-right:0}
.x span{position:absolute;top:8px;transform:translateX(50%);font-size:.85rem;color:var(--muted)}
.x .past{right:84%}.x .now{right:50%}.x .fut{right:12%}
.x b{position:absolute;top:28px;right:0;font-size:.95rem}
.note{margin-top:18px;font-size:.9rem;color:var(--muted);max-width:70ch}
@media (max-width:640px){.y{width:44px}.y b{margin-right:12px;font-size:.8rem}.y span{margin-right:12px;font-size:.7rem}.x span{font-size:.72rem}}
</style>
</head>
<body>
<div class="pv">תצוגה בלבד. העמוד החי לא השתנה. <a href="../../method/">לעמוד העומק</a></div>
<main>
  <h1>הכאורד, עם ציר זמן וציר מגוון</h1>
  <div class="chart">
    <div class="y" aria-hidden="true"><div class="line"></div><span>גבוה</span><b>מגוון</b><span>נמוך</span></div>
    <figure class="img"><img src="chaordic-original.jpg" alt="המרחב הכאורדי: קריסה, כאוס, הכאורד, סדר ושליטה. הדמות המשוטטת של ליאל הולכת בתוך המרחב הכאורדי, במעבר בין כאוס לסדר." width="1600" height="800"></figure>
    <div class="x" aria-hidden="true"><span class="past">עבר</span><span class="now">הווה</span><span class="fut">עתיד</span><b>זמן</b></div>
  </div>
  <p class="note">האיור המקורי לא שונה. הצירים נוספו מסביבו כקווים וטקסט. ציר המגוון מסמן רק כיוון, נמוך וגבוה, ואין עליו עקומה או ערכים.</p>
</main>
</body>
</html>
